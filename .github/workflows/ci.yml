name: CI

# The app supports macOS 26 and later only, so one job on the oldest
# supported macOS covers it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      # A cold cache once failed to resolve and then resolved on a rerun.
      - run: swift package resolve || swift package resolve
      - run: swift test
      - run: scripts/build-app.sh
